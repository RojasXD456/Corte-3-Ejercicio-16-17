<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abastico - Registro de Ventas (Bootstrap)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .caja-inventario {
      background-color: #f8f9fa;
      border-radius: 8px;
      padding: 15px;
    }
    .caja-inventario .badge {
      font-size: 1rem;
    }
  </style>
</head>

<body>

  <!-- SECCIÓN PRINCIPAL -->
  <section id="body">
    <div class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Gestión de Ventas - Abastico</h2>
        <button id="body_btNuevoCliente" class="btn btn-primary">
          + Nuevo Cliente
        </button>
      </div>

      <!-- Inventario Disponible -->
      <div class="caja-inventario d-flex gap-4 mb-3">
        <div>
          <span class="fw-bold">Frutas:</span>
          <span class="badge bg-success" id="body_lblFrutasDisponible">20</span> kg
        </div>
        <div>
          <span class="fw-bold">Carne:</span>
          <span class="badge bg-danger" id="body_lblCarneDisponible">10</span> kg
        </div>
      </div>

      <!-- Tabla de Clientes -->
      <h5>Clientes Atendidos</h5>
      <table class="table table-striped table-hover">
        <thead class="table-dark">
          <tr>
            <th>Cédula</th>
            <th>Nombre</th>
            <th>Frutas (kg)</th>
            <th>Carne (kg)</th>
            <th>Monto Pagar ($)</th>
          </tr>
        </thead>
        <tbody id="body_clientes">
          <tr>
            <td colspan="5" class="text-muted text-center">Sin clientes registrados</td>
          </tr>
        </tbody>
      </table>

      <hr />
      <div class="row">
        <div class="col-sm-6">
          <strong>Cantidad de Clientes:</strong>
          <span id="body_lblCantidadClientes">0</span>
        </div>
        <div class="col-sm-6">
          <strong>Total Cobrado:</strong> $
          <span id="body_lblTotalCobrado">0.00</span>
        </div>
      </div>
    </div>
  </section>

  <!-- MODAL CLIENTE -->
  <div id="cliente" class="modal fade" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Procesar Cliente</h5>
          <button type="button" class="btn-close" id="cliente_btCancelar"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="cliente_inNombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="cliente_inNombre" placeholder="Nombre del cliente" />
          </div>
          <div class="mb-3">
            <label for="cliente_inCedula" class="form-label">Cédula</label>
            <input type="number" class="form-control" id="cliente_inCedula" placeholder="Ej: 25123456" />
          </div>
          <div class="mb-3">
            <label for="cliente_inCantFrutas" class="form-label">Frutas (kg)</label>
            <input type="number" class="form-control" id="cliente_inCantFrutas" placeholder="Ej: 3" />
          </div>
          <div class="mb-3">
            <label for="cliente_inCantCarne" class="form-label">Carne (kg)</label>
            <input type="number" class="form-control" id="cliente_inCantCarne" placeholder="Ej: 1" />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cliente_btCancelarFooter">Cancelar</button>
          <button type="button" class="btn btn-primary" id="cliente_btAceptar">Aceptar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>

  <script type="module">
    import Cl_cTienda from "./dist/controllers/Cl_cTienda.js";
    import Cl_cCliente from "./dist/controllers/Cl_cCliente.js";

    import Cl_vTiendaBootstrap from "./dist/views/Cl_vTiendaBootstrap.js";
    import Cl_vClienteBootstrap from "./dist/views/Cl_vClienteBootstrap.js";

    const vistaTienda = new Cl_vTiendaBootstrap();
    const vistaCliente = new Cl_vClienteBootstrap();

    const controladorCliente = new Cl_cCliente(vistaCliente);
    new Cl_cTienda(vistaTienda, controladorCliente);
  </script>
</body>

</html>
